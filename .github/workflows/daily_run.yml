name: Daily Job Tracker Automation

on:
  schedule:
    # 02:18 UTC (TSİ 05:18)
    - cron: '18 2 * * *'
  workflow_dispatch:

permissions:
  contents: write  # processed_jobs.json dosyasını repoya yazabilmesi için gerekli izin

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Otomasyon Botunu Çalıştır
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SCORE_THRESHOLD: "65"
        run: python -u main.py

      - name: Hafızayı Repoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_jobs.json
          git commit -m "chore: incelenen ilanlar hafizaya eklendi [skip ci]" || echo "Yeni dosya degisikligi yok"
          git push
