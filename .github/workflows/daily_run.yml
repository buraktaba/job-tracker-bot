name: Daily Job Tracker Automation

on:
  schedule:
    # Her sabah Türkiye saatiyle tam 04:00'te çalışır (UTC 01:00)
    - cron: '0 1 * * *'
  # GitHub arayüzünden manuel çalıştırma imkanı
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Otomasyon Botunu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SCORE_THRESHOLD: 65
        run: python main.py
